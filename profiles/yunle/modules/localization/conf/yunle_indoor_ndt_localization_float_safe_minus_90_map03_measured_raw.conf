--flagfile=/apollo/modules/common/data/global_flagfile.txt

# Map03 measured-extrinsic CPU-NDT raw output for Z-stabilized Yunle fusion.
# Apollo CPU-NDT still performs the fixed-map scan matching, but writes to
# Yunle raw topics so the stabilizer can publish the final localization topics
# without creating duplicate /apollo/localization/pose writers.
--map_dir=/apollo_workspace/data/map_work/yunle_indoor
--ndt_map_dir=jd03_indoor_20260803_03/ndt_map
--local_map_name=local_map_float_safe
--if_utm_zone_id_from_folder=true
--local_utm_zone_id=50

--lidar_topic=/apollo/yunle/indoor/ndt/PointCloud2
--lidar_extrinsics_file=/apollo/modules/localization/msf/params/yunle_indoor_ndt_lidar_extrinsics_minus_90_measured.yaml
--lidar_height_file=/apollo/modules/localization/msf/params/yunle_indoor_ndt_lidar_height.yaml

--broadcast_tf_frame_id=world
--broadcast_tf_child_frame_id=localization

--online_resolution=0.10
--ndt_target_resolution=0.25
--ndt_max_iterations=20
--ndt_line_search_step_size=0.10
--ndt_transformation_epsilon=0.001
--ndt_filter_size_x=16
--ndt_filter_size_y=16
--ndt_bad_score_count_threshold=10
--ndt_warnning_ndt_score=0.50
--ndt_error_ndt_score=1.00
--ndt_debug_log_flag=true

--localization_topic=/apollo/yunle/indoor/ndt/raw_pose
--localization_ndt_topic=/apollo/yunle/indoor/ndt/raw_lidar
--localization_msf_status=/apollo/localization/msf_status
--ins_stat_topic=/apollo/yunle/indoor/ndt/disabled_ins_stat
