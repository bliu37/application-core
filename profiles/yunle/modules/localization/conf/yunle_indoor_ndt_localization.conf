--flagfile=/apollo/modules/common/data/global_flagfile.txt

# Fixed indoor NDT map generated from jd03_indoor_20260803_01/global.pcd.
--map_dir=/apollo_workspace/data/map_work/yunle_indoor
--ndt_map_dir=jd03_indoor_20260803_01/ndt_map
--local_map_name=local_map
--if_utm_zone_id_from_folder=true
--local_utm_zone_id=50

# YunleIndoorNdtInputBridge pairs LIORF relative odometry with a delayed raw
# LS-C16 V4 cloud so NDT has a bracketing pose buffer before matching.
--lidar_topic=/apollo/yunle/indoor/ndt/PointCloud2
--lidar_extrinsics_file=/apollo/modules/localization/msf/params/yunle_indoor_ndt_lidar_extrinsics.yaml
--lidar_height_file=/apollo/modules/localization/msf/params/yunle_indoor_ndt_lidar_height.yaml

# The current fixed map and LIORF relative odometry both use the lidar origin.
# A real vehicle-reference extrinsic is deferred until after reload validation.
--broadcast_tf_frame_id=world
--broadcast_tf_child_frame_id=localization

# CPU NDT parameters for the small indoor map. Map and target resolutions must
# agree; online points use a finer voxel filter for the 16-channel lidar.
--online_resolution=0.10
--ndt_target_resolution=0.25
--ndt_max_iterations=20
--ndt_line_search_step_size=0.10
--ndt_transformation_epsilon=0.001
--ndt_filter_size_x=16
--ndt_filter_size_y=16
--ndt_bad_score_count_threshold=10
--ndt_warnning_ndt_score=0.50
--ndt_error_ndt_score=1.00
--ndt_debug_log_flag=true

# Output topics. No real GNSS/INS status is used by this indoor position chain.
--localization_topic=/apollo/localization/pose
--localization_ndt_topic=/apollo/localization/ndt_lidar
--localization_msf_status=/apollo/localization/msf_status
--ins_stat_topic=/apollo/yunle/indoor/ndt/disabled_ins_stat
